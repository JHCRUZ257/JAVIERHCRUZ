<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
<defs>
  <linearGradient id="quijote" x1="180" y1="80" x2="500" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#315575"/><stop offset="1" stop-color="#0e2239"/></linearGradient>
  <linearGradient id="frankenstein" x1="1060" y1="80" x2="1410" y2="660" gradientUnits="userSpaceOnUse"><stop stop-color="#536b78"/><stop offset="1" stop-color="#172a3a"/></linearGradient>
  <linearGradient id="dracula" x1="640" y1="390" x2="1010" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#422b4c"/><stop offset="1" stop-color="#101c35"/></linearGradient>
  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d99b"/><stop offset=".5" stop-color="#b99455"/><stop offset="1" stop-color="#f0d99b"/></linearGradient>
  <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020916" flood-opacity=".55"/></filter>
</defs>
<g opacity=".56" filter="url(#shadow)">
  <!-- Biografía de Albert Einstein -->
  <g transform="rotate(-8 350 320)">
    <rect x="175" y="58" width="350" height="535" rx="8" fill="url(#quijote)" stroke="url(#foil)" stroke-opacity=".68" stroke-width="2"/>
    <rect x="192" y="75" width="316" height="501" rx="3" stroke="#e6d5ad" stroke-opacity=".48"/>
    <circle cx="350" cy="260" r="84" stroke="#ead7ad" stroke-opacity=".34" stroke-width="2"/>
    <ellipse cx="350" cy="260" rx="84" ry="33" transform="rotate(-32 350 260)" stroke="#ead7ad" stroke-opacity=".58" stroke-width="2"/>
    <ellipse cx="350" cy="260" rx="84" ry="33" transform="rotate(32 350 260)" stroke="#d8b66f" stroke-opacity=".58" stroke-width="2"/>
    <circle cx="350" cy="260" r="7" fill="#f0d99b" fill-opacity=".72"/>
    <text x="350" y="132" text-anchor="middle" fill="#f4ead2" font-family="Georgia,serif" font-size="13" letter-spacing="4">BIOGRAFÍA</text>
    <text x="350" y="430" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="19" letter-spacing="4">ALBERT</text>
    <text x="350" y="473" text-anchor="middle" fill="#fff3d4" font-family="Georgia,serif" font-size="35" letter-spacing="2">EINSTEIN</text>
    <path d="M313 520h74" stroke="url(#foil)" stroke-width="2"/>
    <text x="350" y="548" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="10" letter-spacing="3">VIDA · CIENCIA · IDEAS</text>
  </g>
  <!-- El diario de Ana Frank -->
  <g transform="rotate(7 1225 320)">
    <rect x="1050" y="58" width="350" height="535" rx="8" fill="url(#frankenstein)" stroke="url(#foil)" stroke-opacity=".68" stroke-width="2"/>
    <rect x="1067" y="75" width="316" height="501" rx="3" stroke="#e6d5ad" stroke-opacity=".48"/>
    <path d="M1225 180c-34 23-47 58-43 104 32-7 51-31 55-70 6 39 25 63 57 70 4-46-9-81-43-104l-14-20z" fill="#d8b66f" fill-opacity=".3" stroke="#ead7ad" stroke-opacity=".48" stroke-width="2"/>
    <path d="M1225 194v107m-29-52 29 16 29-16" stroke="#ead7ad" stroke-opacity=".45" stroke-width="2"/>
    <text x="1225" y="137" text-anchor="middle" fill="#f4ead2" font-family="Georgia,serif" font-size="13" letter-spacing="4">EL DIARIO DE</text>
    <text x="1225" y="428" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="31" letter-spacing="3">ANA</text>
    <text x="1225" y="470" text-anchor="middle" fill="#fff3d4" font-family="Georgia,serif" font-size="35" letter-spacing="3">FRANK</text>
    <path d="M1188 520h74" stroke="url(#foil)" stroke-width="2"/>
    <text x="1225" y="548" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="10" letter-spacing="3">MEMORIA · ESPERANZA</text>
  </g>
  <!-- Cien años de soledad -->
  <g transform="rotate(-5 650 675)">
    <rect x="480" y="415" width="340" height="515" rx="8" fill="url(#dracula)" stroke="url(#foil)" stroke-opacity=".68" stroke-width="2"/>
    <rect x="497" y="432" width="306" height="481" rx="3" stroke="#e6d5ad" stroke-opacity=".48"/>
    <path d="M650 500c-2 65-5 113-1 182m1-139c-37-32-64-34-83-16m81 47c35-37 63-42 84-23m-81 75c-38-24-65-25-83-7m84-2c35-27 60-30 79-12" stroke="#ead7ad" stroke-opacity=".48" stroke-width="2"/>
    <g fill="#d8b66f" fill-opacity=".58">
      <ellipse cx="568" cy="532" rx="8" ry="15" transform="rotate(-40 568 532)"/>
      <ellipse cx="733" cy="550" rx="8" ry="15" transform="rotate(40 733 550)"/>
      <ellipse cx="565" cy="605" rx="8" ry="15" transform="rotate(-42 565 605)"/>
      <ellipse cx="731" cy="630" rx="8" ry="15" transform="rotate(42 731 630)"/>
      <circle cx="651" cy="571" r="6"/>
    </g>
    <text x="650" y="485" text-anchor="middle" fill="#f4ead2" font-family="Georgia,serif" font-size="12" letter-spacing="4">GABRIEL GARCÍA MÁRQUEZ</text>
    <text x="650" y="770" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="23" letter-spacing="2">CIEN AÑOS</text>
    <text x="650" y="811" text-anchor="middle" fill="#fff3d4" font-family="Georgia,serif" font-size="28" letter-spacing="2">DE SOLEDAD</text>
    <path d="M613 860h74" stroke="url(#foil)" stroke-width="2"/>
    <text x="650" y="888" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="9" letter-spacing="3">UNA SAGA FAMILIAR</text>
  </g>
  <!-- La teoría de la relatividad -->
  <g transform="rotate(5 1080 680)">
    <rect x="910" y="415" width="340" height="515" rx="8" fill="url(#frankenstein)" stroke="url(#foil)" stroke-opacity=".68" stroke-width="2"/>
    <rect x="927" y="432" width="306" height="481" rx="3" stroke="#e6d5ad" stroke-opacity=".48"/>
    <path d="M963 627c48-22 103-24 181-7 32 7 60 6 87-3M957 658c70-15 134-11 194 8 31 10 57 9 82 1M962 690c64-9 127-3 180 19 36 15 64 14 91 3M989 596c-16 39-17 82-3 130m50-154c-7 65 3 117 22 163m51-173c-1 71 13 128 31 177m47-172c5 62 17 112 30 151" stroke="#dce2dc" stroke-opacity=".42" stroke-width="1.5"/>
    <text x="1080" y="485" text-anchor="middle" fill="#f4ead2" font-family="Georgia,serif" font-size="12" letter-spacing="4">ALBERT EINSTEIN</text>
    <text x="1080" y="560" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="21" letter-spacing="2">E = mc²</text>
    <text x="1080" y="777" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="22" letter-spacing="2">LA TEORÍA</text>
    <text x="1080" y="813" text-anchor="middle" fill="#fff3d4" font-family="Georgia,serif" font-size="25" letter-spacing="1">DE LA</text>
    <text x="1080" y="850" text-anchor="middle" fill="#fff3d4" font-family="Georgia,serif" font-size="23" letter-spacing="1">RELATIVIDAD</text>
    <path d="M1043 875h74" stroke="url(#foil)" stroke-width="2"/>
    <text x="1080" y="898" text-anchor="middle" fill="#e5d4ae" font-family="Georgia,serif" font-size="9" letter-spacing="3">CIENCIA · ESPACIO · TIEMPO</text>
  </g>
</g>
<g class="writer-mottos" font-family="Georgia,serif" fill="#e8cf91" opacity=".23">
  <g transform="rotate(-5 790 120)">
    <text x="790" y="112" font-size="24" font-style="italic">«Se hace camino al andar.»</text>
    <text x="792" y="139" font-family="monospace" font-size="10" letter-spacing="2">ANTONIO MACHADO</text>
  </g>
  <g transform="rotate(4 105 315)">
    <text x="40" y="307" font-size="22" font-style="italic">«La pluma es lengua</text>
    <text x="40" y="334" font-size="22" font-style="italic">del alma.»</text>
    <text x="42" y="357" font-family="monospace" font-size="10" letter-spacing="2">MIGUEL DE CERVANTES</text>
  </g>
  <g transform="rotate(-4 1475 286)">
    <text x="1410" y="280" font-size="20" font-style="italic">«Siempre habrá</text>
    <text x="1410" y="305" font-size="20" font-style="italic">poesía.»</text>
    <text x="1412" y="328" font-family="monospace" font-size="10" letter-spacing="2">G. A. BÉCQUER</text>
  </g>
  <g transform="rotate(-3 150 785)">
    <text x="45" y="780" font-size="22" font-style="italic">«Cultivo una rosa blanca.»</text>
    <text x="47" y="806" font-family="monospace" font-size="10" letter-spacing="2">JOSÉ MARTÍ</text>
  </g>
  <g transform="rotate(4 1440 700)">
    <text x="1350" y="692" font-size="21" font-style="italic">«Juventud, divino tesoro.»</text>
    <text x="1352" y="718" font-family="monospace" font-size="10" letter-spacing="2">RUBÉN DARÍO</text>
  </g>
  <g transform="rotate(-2 1160 965)">
    <text x="1060" y="955" font-size="21" font-style="italic">«Tristes guerras, si no es</text>
    <text x="1060" y="981" font-size="21" font-style="italic">amor la empresa.»</text>
    <text x="1062" y="997" font-family="monospace" font-size="9" letter-spacing="2">MIGUEL HERNÁNDEZ</text>
  </g>
</g>
</svg>