<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
<defs>
  <linearGradient id="quijote" x1="180" y1="80" x2="500" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#315575"/><stop offset="1" stop-color="#0e2239"/></linearGradient>
  <linearGradient id="frankenstein" x1="1060" y1="80" x2="1410" y2="660" gradientUnits="userSpaceOnUse"><stop stop-color="#536b78"/><stop offset="1" stop-color="#172a3a"/></linearGradient>
  <linearGradient id="dracula" x1="640" y1="390" x2="1010" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#422b4c"/><stop offset="1" stop-color="#101c35"/></linearGradient>
  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0d99b"/><stop offset=".5" stop-color="#b99455"/><stop offset="1" stop-color="#f0d99b"/></linearGradient>
  <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020916" flood-opacity=".55"/></filter>
</defs>
<g class="writer-mottos" font-family="Georgia,serif" fill="#e8cf91" opacity=".23">
  <g transform="rotate(-5 790 120)">
    <text x="790" y="112" font-size="24" font-style="italic">«Se hace camino al andar.»</text>
    <text x="792" y="139" font-family="monospace" font-size="10" letter-spacing="2">ANTONIO MACHADO</text>
  </g>
  <g transform="rotate(4 105 315)">
    <text x="40" y="307" font-size="22" font-style="italic">«La pluma es lengua</text>
    <text x="40" y="334" font-size="22" font-style="italic">del alma.»</text>
    <text x="42" y="357" font-family="monospace" font-size="10" letter-spacing="2">MIGUEL DE CERVANTES</text>
  </g>
  <g transform="rotate(-4 1475 286)">
    <text x="1410" y="280" font-size="20" font-style="italic">«Siempre habrá</text>
    <text x="1410" y="305" font-size="20" font-style="italic">poesía.»</text>
    <text x="1412" y="328" font-family="monospace" font-size="10" letter-spacing="2">G. A. BÉCQUER</text>
  </g>
  <g transform="rotate(-3 150 785)">
    <text x="45" y="780" font-size="22" font-style="italic">«Cultivo una rosa blanca.»</text>
    <text x="47" y="806" font-family="monospace" font-size="10" letter-spacing="2">JOSÉ MARTÍ</text>
  </g>
  <g transform="rotate(4 1440 700)">
    <text x="1350" y="692" font-size="21" font-style="italic">«Juventud, divino tesoro.»</text>
    <text x="1352" y="718" font-family="monospace" font-size="10" letter-spacing="2">RUBÉN DARÍO</text>
  </g>
  <g transform="rotate(-2 1160 965)">
    <text x="1060" y="955" font-size="21" font-style="italic">«Tristes guerras, si no es</text>
    <text x="1060" y="981" font-size="21" font-style="italic">amor la empresa.»</text>
    <text x="1062" y="997" font-family="monospace" font-size="9" letter-spacing="2">MIGUEL HERNÁNDEZ</text>
  </g>
</g>
</svg>